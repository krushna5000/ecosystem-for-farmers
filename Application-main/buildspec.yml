version: 0.2

env:
  variables:
    FLUTTER_CHANNEL: stable

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Installing Flutter SDK"
      - git clone --depth 1 -b $FLUTTER_CHANNEL https://github.com/flutter/flutter.git
      - export PATH="$PATH:$(pwd)/flutter/bin"
      - flutter --version

  pre_build:
    commands:
      - echo "Fetching dependencies"
      - flutter pub get

  build:
    commands:
      - echo "Running static analysis"
      - flutter analyze || true
      - echo "CI checks completed successfully"

artifacts:
  files:
    - '**/*'
