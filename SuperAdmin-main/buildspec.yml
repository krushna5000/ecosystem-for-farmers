version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing frontend dependencies"
      - cd Frontend
      - npm install

  build:
    commands:
      - echo "Building frontend application"
      - npm run build

artifacts:
  files:
    - '**/*'
  base-directory: Frontend/dist

cache:
  paths:
    - Frontend/node_modules/**/*
